[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warchest-engine"
version = "0.3.0"
description = "War Chest base and expansion rules engine and two-player online game"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
web = ["Flask>=3.1,<4", "waitress>=3,<4"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
warchest = "warchest.cli:main"
warchest-web = "warchest.web:main"

[tool.setuptools.packages.find]
include = ["warchest*"]

[tool.setuptools.package-data]
warchest = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
